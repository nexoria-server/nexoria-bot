[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexoria-bot"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "discord.py>=2.5,<3",
  "mcstatus>=12,<13",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["nexoria*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy_sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
